<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas (.txt)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-center">📋 CRUD Simples em TXT</h1>
        
        <!-- Formulário de Entrada (Integrado com a issue do Integrante 1) -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form action="/add" method="POST" class="row g-3">
                    <div class="col-md-9">
                        <input type="text" name="titulo" class="form-control" placeholder="Digite o nome da tarefa..." required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">+ Adicionar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela de Exibição [READ] (Issue do Integrante 2) -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Lista de Tarefas</h5>
                <table class="table table-hover mt-3">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Tarefa</th>
                            <th>Status</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if tarefas %}
                            {% for item in tarefas %}
                            <tr>
                                <td>{{ item.id }}</td>
                                <td>{{ item.titulo }}</td>
                                <td>
                                    <span class="badge {% if item.status == 'Concluido' %}bg-success{% else %}bg-warning text-dark{% endif %}">
                                        {{ item.status }}
                                    </span>
                                </td>
                                <td class="text-center">
                                    <a href="/toggle/{{ item.id }}" class="btn btn-sm btn-outline-secondary">Alterar Status</a>
                                    <a href="/delete/{{ item.id }}" class="btn btn-sm btn-outline-danger">Excluir</a>
                                </td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="4" class="text-center text-muted">Nenhuma tarefa encontrada em dados.txt.</td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
