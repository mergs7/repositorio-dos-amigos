<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador CRUD - Arquivo TXT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">Gerenciador de Tarefas (CRUD em TXT)</h1>
        
        <!-- Form de Cadastro (Integrante 1 - CREATE) -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Novo Item</h5>
                <form action="/add" method="POST" class="row g-3">
                    <div class="col-md-7">
                        <input type="text" name="nome" class="form-control" placeholder="Descrição do item/tarefa" required>
                    </div>
                    <div class="col-md-3">
                        <select name="status" class="form-select">
                            <option value="Pendente">Pendente</option>
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Concluído">Concluído</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Adicionar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela de Exibição (Integrante 2 - READ) -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Lista de Registros</h5>
                <table class="table table-striped align-middle mt-3">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Status</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in itens %}
                        <tr>
                            <td>{{ item.id }}</td>
                            <td>{{ item.nome }}</td>
                            <td>
                                <span class="badge {% if item.status == 'Concluído' %}bg-success{% elif item.status == 'Em Andamento' %}bg-warning text-dark{% else %}bg-secondary{% endif %}">
                                    {{ item.status }}
                                </span>
                            </td>
                            <td class="text-end">
                                <!-- Botões de Edição e Exclusão (Integrante 3 - UPDATE/DELETE) -->
                                <button class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" data-bs-target="#editModal{{ item.id }}">Editar</button>
                                <a href="/delete/{{ item.id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Excluir este item?')">Excluir</a>

                                <!-- Modal de Edição -->
                                <div class="modal fade text-start" id="editModal{{ item.id }}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <form action="/edit/{{ item.id }}" method="POST">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Editar Registro #{{ item.id }}</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <div class="mb-3">
                                                        <label class="form-label">Nome</label>
                                                        <input type="text" name="nome" class="form-control" value="{{ item.nome }}" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Status</label>
                                                        <select name="status" class="form-select">
                                                            <option value="Pendente" {% if item.status == 'Pendente' %}selected{% endif %}>Pendente</option>
                                                            <option value="Em Andamento" {% if item.status == 'Em Andamento' %}selected{% endif %}>Em Andamento</option>
                                                            <option value="Concluído" {% if item.status == 'Concluído' %}selected{% endif %}>Concluído</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">Nenhum registro encontrado no arquivo dados.txt.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
