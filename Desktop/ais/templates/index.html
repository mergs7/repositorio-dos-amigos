<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRUD Flask com TXT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h1 class="mb-4">Gerenciador de Tarefas (CRUD TXT)</h1>
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Cadastrar Novo Item</h5>
            <form action="/add" method="POST" class="row g-3">
                <div class="col-md-6">
                    <input type="text" name="nome" class="form-control" placeholder="Nome do Item / Tarefa" required>
                </div>
                <div class="col-md-4">
                    <select name="status" class="form-select">
                        <option value="Pendente">Pendente</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>
    <h3>Itens Cadastrados</h3>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.nome }}</td>
                <td>{{ item.status }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-muted">Nenhum item cadastrado ainda.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
